# TabbyAPI + ExLlamaV3 1.4.6 — turboderp/Qwen3.8-Flash-Next-exl3 @ 4.05bpw_h6_ng6
# Chiavi da config_sample.yml TabbyAPI (04/09/2026). draft_mode viene sostituito dallo script.
network:
  host: 0.0.0.0
  port: 5000
  disable_auth: true
  api_servers: ["OAI"]
logging:
  log_prompt: false
  log_generation_params: false
model:
  model_dir: /app/models
  model_name: exl3-4.05bpw
  backend: exllamav3
  max_seq_len: 262144
  cache_size: 262144
  cache_mode: FP16
  chunk_size: 4096
  gpu_split_auto: true
  vision: true
  ngram_ram: true
  tool_format: qwen3_coder
  reasoning: true
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
draft_model:
  draft_mode: __DRAFT_MODE__
  dynamic_draft: false
